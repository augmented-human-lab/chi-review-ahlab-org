<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Square PWA icon source. Full-bleed gradient so the maskable crop (circle/squircle)
       still shows brand colour; the "C" sits inside the central ~60% safe zone. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00D7EE"/>
      <stop offset="1" stop-color="#6100FF"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#g)"/>
  <text x="256" y="366" font-family="Georgia, 'Times New Roman', serif" font-size="340" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
</svg>
